name: FMCSA weekly scraper

on:
  schedule:
    # Every Tuesday at 12:00 PM UTC
    # NOTE: GitHub Actions uses UTC.
    # Noon Central = 18:00 UTC (standard time)
    # Noon Eastern = 17:00 UTC
    - cron: "0 18 * * 2"

  workflow_dispatch: {}  # allows manual runs

jobs:
  run-scrapers:
    runs-on: ubuntu-latest
    env:
      MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}  # <-- Add this

    steps:
    
      # -----------------------------
      # Check out repo
      # -----------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------
      # Set up Python + cache deps
      # -----------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

       # -----------------------------
      # Write Mapbox token JS
      # -----------------------------
      - name: Write Mapbox token JS
        run: |
          mkdir -p app/static
          echo "const MAPBOX_TOKEN = '${{ secrets.MAPBOX_TOKEN }}';" > app/static/mapbox_token.js

      # -----------------------------
      # Run main FMCSA scraper
      # -----------------------------
      - name: Run FMCSA main scraper
        run: python scripts/fmcsa_scraper.py

      # -----------------------------
      # Run FMCSA training locations scraper
      # -----------------------------
      - name: Run FMCSA training location scraper
        run: python scripts/fmcsa_training_location_scraper.py

      # -----------------------------
      # Geocode new cities only
      # -----------------------------
      - name: Geocode new cities
        run: python scripts/geocode_all_cities.py

      # -----------------------------
      # Fix geocode cache manually
      # -----------------------------
      - name: Fix geocode cache
        run: python scripts/fix_geocode_cache.py

      # -----------------------------
      # Log diffs (week-to-week changes)
      # -----------------------------
      - name: Show file diffs
        run: |
          git status
          git diff > diff.txt || true
          cat diff.txt

      # -----------------------------
      # Commit changes if any
      # -----------------------------
      - name: Commit and push changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git add .
            git commit -m "Weekly FMCSA data update"
            git push
          else
            echo "No changes to commit"
          fi

      # -----------------------------
      # Upload diff as artifact
      # -----------------------------
      - name: Upload diff artifact
        uses: actions/upload-artifact@v4
        with:
          name: weekly-diff
          path: diff.txt
