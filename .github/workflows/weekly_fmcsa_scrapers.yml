name: Weekly FMCSA scrapers

on:
  schedule:
    # Every Tuesday at 12:00 PM Central Time
    # GitHub Actions uses UTC → 18:00 UTC = 12:00 CT
    - cron: '0 18 * * 2'

  # Allows manual runs from the Actions tab
  workflow_dispatch:

jobs:
  run-scrapers:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run FMCSA training locations scraper
        run: |
          python scripts/fmcsa_training_locations_scraper.py

      - name: Run FMCSA main scraper
        run: |
          python scripts/fmcsa_scraper.py

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/outputs_current
          git commit -m "Weekly FMCSA data update" || exit 0
          git push
